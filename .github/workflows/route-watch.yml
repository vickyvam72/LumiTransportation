name: Pantau perubahan rute

# Mengecek GTFS resmi Transjakarta tiap jam. Bila ada rute yang berubah, data/route_changes.json
# diperbarui; aplikasi membaca file ini tiap jam dan langsung memberi notifikasi.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [ main ]
    paths: [ "tools/route_watch.py", ".github/workflows/route-watch.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: route-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cek GTFS resmi
        run: |
          # Catat status (berhasil / gagal) ke data/watch_status.json agar terlihat tanpa membuka log.
          if python3 tools/route_watch.py --data data --save-zip "$RUNNER_TEMP/gtfs.zip" 2> err.txt; then
            printf '{\n "ok": true\n}\n' > data/watch_status.json
          else
            python3 -c "import json;print(json.dumps({'ok':False,'error':open('err.txt').read()[-600:]},indent=1))" > data/watch_status.json
          fi

      # Ringkasan GTFS siap pakai (format sama dengan GtfsImporter di HP) di cabang gtfs-data,
      # diperbarui hanya saat GTFS resmi berubah (atau bila cabangnya belum ada).
      - name: Ringkasan GTFS untuk aplikasi (cabang gtfs-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -f "$RUNNER_TEMP/gtfs.zip" ] || exit 0
          if git diff --quiet -- data/gtfs_meta.json && git ls-remote --exit-code --heads origin gtfs-data >/dev/null; then
            echo "GTFS tidak berubah, cabang gtfs-data sudah ada."; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/cls" "$RUNNER_TEMP/g"
          javac -d "$RUNNER_TEMP/cls" app/src/main/java/id/lumi/transport/GtfsImporter.java
          java -cp "$RUNNER_TEMP/cls" id.lumi.transport.GtfsImporter "$RUNNER_TEMP/gtfs.zip" "$RUNNER_TEMP/g/tj_gtfs.json"
          cp data/gtfs_meta.json "$RUNNER_TEMP/g/"
          cd "$RUNNER_TEMP/g"
          git init -q && git checkout -q -b gtfs-data
          git config user.name "lumi-route-watch[bot]" && git config user.email "lumi-route-watch@users.noreply.github.com"
          git add . && git commit -qm "GTFS ringkas $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gtfs-data

      - name: Simpan perubahan
        run: |
          git config user.name "lumi-route-watch[bot]"
          git config user.email "lumi-route-watch@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "data: pembaruan rute $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
