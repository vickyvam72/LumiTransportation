name: Pantau perubahan rute

# Mengecek GTFS resmi Transjakarta tiap jam. Bila ada rute yang berubah, data/route_changes.json
# diperbarui; aplikasi membaca file ini tiap jam dan langsung memberi notifikasi.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: route-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cek GTFS resmi
        run: python3 tools/route_watch.py --data data

      - name: Simpan perubahan
        run: |
          git config user.name "lumi-route-watch[bot]"
          git config user.email "lumi-route-watch@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "data: pembaruan rute $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
