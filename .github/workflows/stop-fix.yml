name: stop-fix
on:
  push:
    branches: [stop-check]
    paths: [".github/workflows/stop-fix.yml", "tools/osm_stops.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GTFS resmi ringkas (cabang gtfs-data)
        run: git fetch -q origin gtfs-data && git show origin/gtfs-data:tj_gtfs.json > tj_gtfs.json || true
      - run: python3 tools/osm_stops.py . 2> data/stop_fix_error.txt || true
      - run: test -s data/stop_fix_error.txt || rm -f data/stop_fix_error.txt
      - run: |
          git config user.name "lumi-route-watch[bot]"
          git config user.email "lumi-route-watch@users.noreply.github.com"
          git add -A data && git commit -qm "data: titik halte/stasiun dari OpenStreetMap" && git push origin HEAD:${GITHUB_REF_NAME}
